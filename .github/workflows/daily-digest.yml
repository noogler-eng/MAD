name: daily-digest

# Summarises the last 24h of commits into a GitHub issue.
# Runs once a day; workflow_dispatch lets you trigger it by hand to test.
#
# Cron is UTC. 02:30 UTC = 08:00 IST, so the digest lands in the morning
# covering the previous day. GitHub may delay scheduled runs by several
# minutes under load, and it disables schedules on repos with no activity
# for 60 days -- push something occasionally or it will quietly stop.
on:
  schedule:
    - cron: '30 2 * * *'
  workflow_dispatch:
    inputs:
      since:
        description: 'Time window to summarise (git --since syntax)'
        required: false
        default: '24 hours ago'

permissions:
  contents: read
  issues: write

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # need history for `git log --since`

      - name: Collect commits
        id: collect
        env:
          SINCE: ${{ github.event.inputs.since || '24 hours ago' }}
        run: |
          git log --since="$SINCE" --no-merges \
            --pretty=format:'--- %h %an %ad%n%s%n%b' --date=short --stat \
            > commits.txt

          count=$(git log --since="$SINCE" --no-merges --oneline | wc -l | tr -d ' ')
          echo "count=$count" >> "$GITHUB_OUTPUT"
          echo "Found $count commits since $SINCE"

          # Nothing happened -- don't open an empty issue.
          if [ "$count" -eq 0 ]; then
            echo "No commits in window; skipping digest."
            exit 0
          fi

          # Cap the payload so a big day cannot blow the token limit.
          head -c 60000 commits.txt > commits_capped.txt

      - name: Summarise with Gemini
        if: steps.collect.outputs.count != '0'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "::error::GEMINI_API_KEY secret is not set."
            exit 1
          fi

          PROMPT='These are the git commits from the last day in a personal
          learning repository. Write a short progress digest in Markdown.

          Structure it as:
          1. A one-sentence summary of what was worked on.
          2. A bullet list grouped by top-level folder (concepts/, frontend/,
             ai-engineering/, flutter/, dsa/, etc.), saying what changed in each.
          3. One line: what looks unfinished or worth picking up next.

          Be concrete and factual -- describe only what the commits and file
          changes actually show. Do not invent progress or pad with praise.

          Commits follow:
          '

          jq -n --arg p "$PROMPT" --rawfile c commits_capped.txt \
            '{contents:[{parts:[{text:($p + $c)}]}],
              generationConfig:{temperature:0.3}}' > body.json

          http=$(curl -sS -o resp.json -w '%{http_code}' -X POST \
            "https://generativelanguage.googleapis.com/v1beta/models/gemini-3.7-flash:generateContent" \
            -H "x-goog-api-key: $GEMINI_API_KEY" \
            -H 'Content-Type: application/json' \
            -d @body.json)

          if [ "$http" != "200" ]; then
            echo "::error::Gemini API returned HTTP $http"
            head -c 800 resp.json
            exit 1
          fi

          jq -r '.candidates[0].content.parts[0].text // empty' resp.json > digest.md
          if [ ! -s digest.md ]; then
            echo "::error::No text in the Gemini response"
            head -c 800 resp.json
            exit 1
          fi

      - name: Open the digest issue
        if: steps.collect.outputs.count != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            cat digest.md
            echo
            echo "---"
            echo "<sub>${{ steps.collect.outputs.count }} commits · gemini-3.7-flash · generated by \`daily-digest\`</sub>"
          } > issue.md

          gh issue create \
            --repo "${{ github.repository }}" \
            --title "Digest: $(date -u +%Y-%m-%d)" \
            --body-file issue.md
